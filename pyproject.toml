[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common-framework"
dynamic = ["version"]
description = "All-in-one framework for Django and Django REST Framework"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "MIT License" }
authors = [
    { name = "Marc Debureaux", email = "marc@debureaux.fr" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "Django>=6.0",
    "djangorestframework>=3.18.3",
    "python-dateutil>=2.8.2,<3",
    "pytz>=2025.2",
]

[project.optional-dependencies]
celery = ["celery>=5.5.3"]
excel = ["openpyxl>=3.1"]
ldap = ["ldap3>=2.9"]
webhooks = ["requests>=2.32.5"]
websocket = ["websocket-client>=1.8", "autobahn>=24.4"]
markdown = ["markdown2>=2.5"]
csv = ["djangorestframework-csv>=3"]
postgresql = ["psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://github.com/debnet/common-framework"

[tool.hatch.version]
path = "common/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/common",
]

[tool.hatch.build.targets.wheel]
include = [
    "/common",
]

[tool.coverage.run]
branch = true
source = ["common"]
omit = ["common/tests/*", "common/migrations/*", "common/runtests.py"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.black]
line-length = 88
target-version = ["py313"]
force-exclude = '/migrations/'
